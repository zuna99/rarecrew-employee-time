name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    name: C# (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore EmployeeTime.sln --locked-mode -m:1
      - run: dotnet test EmployeeTime.sln --configuration Release --no-restore -m:1

  angular:
    name: Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/angular
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/angular/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
